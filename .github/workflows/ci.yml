name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: bnk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_MODE: synthetic
      PROSPERITY_ENVIRONMENT: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:ci
        env:
          ENGINE_EPHEMERAL_DIR: ${{ runner.temp }}/prosperity-${{ github.run_id }}-${{ github.run_attempt }}
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: engine
          POSTGRES_DB: engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATA_MODE: synthetic
      ENGINE_TEST_DATABASE_URL: postgres://engine:engine@localhost:5432/engine_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/postgres-store.test.mjs
